# 登录超时测试专用配置（与生产 rbox.conf 相同，仅密码超时改为 3 秒）
[paths]
system_dir = "/etc/rbox/system"
default_target = "default.target"
status_socket = "/tmp/rbox.sock"
passwd = "/etc/passwd"
shadow = "/etc/shadow"
motd = "/etc/motd"
profile = "/etc/profile"
fstab = "/etc/fstab"
hostname = "/etc/hostname"
sysctl_conf = "/etc/sysctl.conf"
proc = "/proc"
meminfo = "/proc/meminfo"
iomem = "/proc/iomem"

[getty]
login_program = "/bin/rlogin"
prompt = "user: "
issue_file = "/etc/issue"
failure_delay = 1

[login]
shell = "/bin/sh"
password_prompt = "passwd: "
password_timeout = 3

[init]
default_path = "/bin:/sbin:/usr/bin:/usr/sbin"

[shell]
default_ps1 = "> "