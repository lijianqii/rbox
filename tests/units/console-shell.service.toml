[Unit]
Description = "Console shell (test override: direct shell, no login)"
Name = "console-shell"

[Service]
Type = "simple"
ExecStart = "/bin/sh"
# 测试覆盖：shell 退出（exit）后由 Restart=always 重启，保留 Environment
Restart = "always"
RestartSec = 1
Environment = ["RBOX_CONSOLE=1"]

[Install]
WantedBy = ["default.target"]