# rbox 全局配置（TOML）
# 所有字段可选：缺省使用代码内默认值（与本文件不存在时行为一致）。
# 修改后重启对应进程生效（init 重启 / 重新登录）。

[paths]
system_dir = "/etc/rbox/system"       # init 单元目录
default_target = "default.target"     # 启动根 target
status_socket = "/tmp/rbox.sock"      # init 控制协议 socket
passwd = "/etc/passwd"                # 用户账号文件
shadow = "/etc/shadow"                # 影子密码文件
motd = "/etc/motd"                    # 登录后欢迎信息
profile = "/etc/profile"              # shell 启动时 source 的 profile
# history_file = "~/.rbox_history"    # shell 历史文件（支持 ~ 前缀；留空用 $HOME/.rbox_history）
fstab = "/etc/fstab"                  # 挂载表
hostname = "/etc/hostname"            # 主机名文件
sysctl_conf = "/etc/sysctl.conf"      # sysctl 配置

[getty]
login_program = "/bin/rlogin"         # rgetty fork 执行的登录程序
prompt = "rbox login: "               # 登录提示
# default_timeout = 60                # 未给 -t 时的默认超时秒数
issue_file = "/etc/issue"             # 登录前横幅（不存在则跳过）
failure_delay = 1                     # 登录失败后重新提示前的延迟秒数

[login]
shell = "/bin/sh"                     # passwd 缺 shell 字段时的缺省 shell
password_prompt = "Password: "        # 密码提示

[init]
default_path = "/bin:/sbin:/usr/bin:/usr/sbin"   # 默认 PATH